<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects — Taskflow</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --surface3: #21212e;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.13);
            --accent: #7c6aff;
            --accent2: #a78bfa;
            --accent-glow: rgba(124,106,255,0.25);
            --text: #f0eeff;
            --text-muted: #8884a8;
            --text-dim: #4a4870;
            --success: #34d399;
            --error: #f87171;
            --grad: linear-gradient(135deg, #7c6aff, #a78bfa);
            --nav-w: 240px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }

        .sidebar {
            width: var(--nav-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 28px 20px;
            flex-shrink: 0; height: 100vh;
        }
        .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; margin-bottom: 36px; }
        .brand-icon { width: 34px; height: 34px; background: var(--grad); border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
        .brand-name { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; }
        .nav-section-label { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-dim); padding: 0 8px; margin-bottom: 8px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 9px; text-decoration: none; color: var(--text-muted); font-size: 14px; transition: all 0.15s; margin-bottom: 2px; }
        .nav-link:hover { background: var(--surface2); color: var(--text); }
        .nav-link.active { background: rgba(124,106,255,0.15); color: var(--accent2); font-weight: 500; }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }
        .sidebar-bottom { margin-top: auto; }
        .user-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .user-avatar { width: 34px; height: 34px; background: var(--grad); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; font-family: 'Syne', sans-serif; flex-shrink: 0; }
        .user-info-name { font-size: 13px; font-weight: 600; }
        .user-role-badge { font-size: 10px; background: rgba(124,106,255,0.2); color: var(--accent2); padding: 2px 7px; border-radius: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .btn-logout { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); border-radius: 9px; color: var(--text-muted); font-size: 13px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-logout:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.2); color: var(--error); }

        .main { flex: 1; overflow-y: auto; padding: 40px 48px; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 36px; }
        .page-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: -0.8px; margin-bottom: 4px; }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }

        .btn-new {
            display: flex; align-items: center; gap: 8px;
            padding: 11px 20px;
            background: var(--grad);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px; font-weight: 600;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-new:hover { opacity: 0.88; }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .project-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            transition: all 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .project-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--grad);
            opacity: 0;
            transition: opacity 0.2s;
        }
        .project-card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .project-card:hover::before { opacity: 1; }

        .project-icon {
            width: 44px; height: 44px;
            background: rgba(124,106,255,0.12);
            border: 1px solid rgba(124,106,255,0.2);
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            margin-bottom: 16px;
        }

        .project-name { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.3px; }
        .project-desc { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin-bottom: 20px; min-height: 40px; }

        .project-meta {
            display: flex; align-items: center; justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .meta-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .meta-avatars { display: flex; }
        .mini-avatar {
            width: 22px; height: 22px;
            background: var(--surface2);
            border: 1.5px solid var(--surface);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700;
            margin-left: -6px;
            color: var(--text-muted);
        }
        .mini-avatar:first-child { margin-left: 0; }

        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px;
            background: var(--surface);
            border: 1px dashed var(--border);
            border-radius: 14px;
            color: var(--text-dim);
        }
        .empty-icon { font-size: 40px; margin-bottom: 16px; opacity: 0.4; }
        .empty-title { font-family: 'Syne', sans-serif; font-size: 18px; font-weight: 700; color: var(--text-muted); margin-bottom: 8px; }
        .empty-desc { font-size: 14px; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(6px);
            z-index: 100;
            align-items: center; justify-content: center;
        }
        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            width: 440px;
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn { from { opacity: 0; transform: scale(0.96) translateY(-10px); } to { opacity: 1; transform: none; } }

        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
        .modal-title { font-family: 'Syne', sans-serif; font-size: 20px; font-weight: 700; }
        .modal-close { background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { color: var(--text); }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
        input, textarea {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            outline: none;
            transition: all 0.2s;
            resize: none;
        }
        input::placeholder, textarea::placeholder { color: var(--text-dim); }
        input:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

        .modal-actions { display: flex; gap: 12px; margin-top: 8px; }
        .btn-create { flex: 1; padding: 13px; background: var(--grad); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.2s; }
        .btn-create:hover { opacity: 0.88; }
        .btn-cancel { padding: 13px 20px; background: var(--surface2); border: 1px solid var(--border); color: var(--text-muted); border-radius: 10px; font-size: 14px; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: all 0.15s; }
        .btn-cancel:hover { color: var(--text); }

        .msg { font-size: 13px; padding: 10px 14px; border-radius: 8px; margin-top: 12px; display: none; }
        .msg.error { background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.2); color: var(--error); display: block; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">✦</div>
        <span class="brand-name">Taskflow</span>
    </div>
    <div class="nav-section-label">Navigation</div>
    <a href="/page/dashboard/" class="nav-link"><span class="nav-icon">⊞</span> Dashboard</a>
    <a href="/page/projects/" class="nav-link active"><span class="nav-icon">📁</span> Projects</a>
    <a href="/page/tasks/" class="nav-link"><span class="nav-icon">✓</span> Tasks</a>
    <div class="sidebar-bottom">
        <div class="user-card">
            <div class="user-avatar" id="avatarInitial">?</div>
            <div>
                <div class="user-info-name" id="sidebarUsername">—</div>
                <div class="user-role-badge" id="sidebarRole">—</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()"><span>⇤</span> Sign out</button>
    </div>
</aside>

<main class="main">
    <div class="page-header">
        <div>
            <div class="page-title">Projects</div>
            <div class="page-subtitle">Manage and organize your team's work.</div>
        </div>
        <button class="btn-new" onclick="openModal()" id="addBtn">
            <span style="font-size:18px;line-height:1">+</span> New Project
        </button>
    </div>

    <div class="projects-grid" id="projectGrid">
        <div class="empty-state"><div class="empty-icon">📁</div><div class="empty-title">Loading...</div></div>
    </div>
</main>

<div class="modal-overlay" id="modal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title">New Project</div>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div class="form-group">
            <label>Project Name</label>
            <input type="text" id="projName" placeholder="e.g. Website Redesign" />
        </div>
        <div class="form-group">
            <label>Description</label>
            <textarea id="projDesc" placeholder="What's this project about?" rows="3"></textarea>
        </div>
        <div class="modal-actions">
            <button class="btn-create" onclick="createProject()">Create Project</button>
            <button class="btn-cancel" onclick="closeModal()">Cancel</button>
        </div>
        <div id="projMsg" class="msg"></div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!token) window.location.href = '/page/login/';

document.getElementById('sidebarUsername').textContent = user.username || '—';
document.getElementById('sidebarRole').textContent = user.role || 'member';
document.getElementById('avatarInitial').textContent = (user.username || '?')[0].toUpperCase();
if (user.role !== 'admin') document.getElementById('addBtn').style.display = 'none';

const projectIcons = ['🚀','💡','⚡','🎯','📊','🛠️','🌟','💎','🔮','🎨'];

async function loadProjects() {
    const res = await fetch('/api/projects/', { headers: { 'Authorization': 'Token ' + token } });
    const projects = await res.json();
    const grid = document.getElementById('projectGrid');
    if (projects.length === 0) {
        grid.innerHTML = `<div class="empty-state"><div class="empty-icon">📁</div><div class="empty-title">No projects yet</div><div class="empty-desc">Create your first project to get started.</div></div>`;
        return;
    }
    grid.innerHTML = projects.map((p, i) => `
        <div class="project-card">
            <div class="project-icon">${projectIcons[i % projectIcons.length]}</div>
            <div class="project-name">${p.name}</div>
            <div class="project-desc">${p.description || 'No description provided.'}</div>
            <div class="project-meta">
                <div class="meta-item">
                    <span>👤</span>
                    <span>${p.created_by?.username || 'Unknown'}</span>
                </div>
                <div class="meta-item meta-avatars">
                    ${(p.members || []).slice(0,4).map(m => `<div class="mini-avatar">${(m.username||'?')[0].toUpperCase()}</div>`).join('')}
                    ${p.members?.length > 4 ? `<div class="mini-avatar">+${p.members.length - 4}</div>` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

async function createProject() {
    const name = document.getElementById('projName').value;
    const description = document.getElementById('projDesc').value;
    const msgEl = document.getElementById('projMsg');
    if (!name) { msgEl.className = 'msg error'; msgEl.textContent = 'Project name is required.'; return; }

    const res = await fetch('/api/projects/', {
        method: 'POST',
        headers: { 'Authorization': 'Token ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, description })
    });
    if (res.ok) { closeModal(); loadProjects(); }
    else { const err = await res.json(); msgEl.className = 'msg error'; msgEl.textContent = JSON.stringify(err); }
}

function openModal() { document.getElementById('modal').classList.add('show'); }
function closeModal() { document.getElementById('modal').classList.remove('show'); document.getElementById('projMsg').className = 'msg'; }
function logout() { localStorage.clear(); window.location.href = '/page/login/'; }

loadProjects();
</script>
</body>
</html>
