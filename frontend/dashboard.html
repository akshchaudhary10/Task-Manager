<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Taskflow</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #111118;
            --surface2: #1a1a24;
            --surface3: #21212e;
            --border: rgba(255,255,255,0.07);
            --border-hover: rgba(255,255,255,0.13);
            --accent: #7c6aff;
            --accent2: #a78bfa;
            --text: #f0eeff;
            --text-muted: #8884a8;
            --text-dim: #4a4870;
            --success: #34d399;
            --warning: #fbbf24;
            --info: #60a5fa;
            --error: #f87171;
            --grad: linear-gradient(135deg, #7c6aff, #a78bfa);
            --nav-w: 240px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; }

        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; }

        /* Sidebar */
        .sidebar {
            width: var(--nav-w);
            background: var(--surface);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            flex-shrink: 0;
            height: 100vh;
        }

        .brand {
            display: flex; align-items: center; gap: 10px;
            padding: 0 8px;
            margin-bottom: 36px;
        }
        .brand-icon {
            width: 34px; height: 34px;
            background: var(--grad);
            border-radius: 9px;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px;
        }
        .brand-name {
            font-family: 'Syne', sans-serif;
            font-size: 18px; font-weight: 700;
        }

        .nav-section-label {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-dim);
            padding: 0 8px;
            margin-bottom: 8px;
        }

        .nav-link {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px;
            border-radius: 9px;
            text-decoration: none;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            transition: all 0.15s;
            margin-bottom: 2px;
        }
        .nav-link:hover { background: var(--surface2); color: var(--text); }
        .nav-link.active {
            background: rgba(124,106,255,0.15);
            color: var(--accent2);
            font-weight: 500;
        }
        .nav-icon { font-size: 16px; width: 20px; text-align: center; }

        .sidebar-bottom { margin-top: auto; }

        .user-card {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 12px;
        }
        .user-avatar {
            width: 34px; height: 34px;
            background: var(--grad);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 14px; font-weight: 700;
            font-family: 'Syne', sans-serif;
            flex-shrink: 0;
        }
        .user-info-name { font-size: 13px; font-weight: 600; }
        .user-role-badge {
            font-size: 10px;
            background: rgba(124,106,255,0.2);
            color: var(--accent2);
            padding: 2px 7px;
            border-radius: 20px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-logout {
            width: 100%;
            padding: 10px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--text-muted);
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.15s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-logout:hover { background: rgba(248,113,113,0.08); border-color: rgba(248,113,113,0.2); color: var(--error); }

        /* Main content */
        .main {
            flex: 1;
            overflow-y: auto;
            padding: 40px 48px;
        }

        .page-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 36px;
        }
        .page-title {
            font-family: 'Syne', sans-serif;
            font-size: 26px; font-weight: 700;
            letter-spacing: -0.8px;
            margin-bottom: 4px;
        }
        .page-subtitle { color: var(--text-muted); font-size: 14px; }

        .date-chip {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
            font-size: 13px;
            color: var(--text-muted);
        }

        /* Stats row */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .stat-card:hover { border-color: var(--border-hover); }
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0;
            width: 80px; height: 80px;
            border-radius: 0 14px 0 80px;
            opacity: 0.06;
        }
        .stat-card:nth-child(1)::before { background: var(--accent); }
        .stat-card:nth-child(2)::before { background: var(--success); }
        .stat-card:nth-child(3)::before { background: var(--warning); }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
            letter-spacing: 0.3px;
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .stat-dot { width: 6px; height: 6px; border-radius: 50%; }
        .stat-dot.purple { background: var(--accent); }
        .stat-dot.green { background: var(--success); }
        .stat-dot.yellow { background: var(--warning); }

        .stat-value {
            font-family: 'Syne', sans-serif;
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1;
        }
        .stat-value.purple { color: var(--accent2); }
        .stat-value.green { color: var(--success); }
        .stat-value.yellow { color: var(--warning); }

        /* Progress bar */
        .progress-section {
            margin-top: 16px;
        }
        .progress-bar {
            height: 4px;
            background: var(--surface2);
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
            background: var(--grad);
            transition: width 0.8s ease;
        }

        /* Tasks table section */
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }
        .section-title {
            font-family: 'Syne', sans-serif;
            font-size: 15px; font-weight: 700;
        }
        .section-count {
            font-size: 12px;
            color: var(--text-muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 20px;
        }

        table { width: 100%; border-collapse: collapse; }
        thead th {
            padding: 12px 24px;
            text-align: left;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            color: var(--text-dim);
            background: var(--surface2);
            border-bottom: 1px solid var(--border);
        }
        tbody tr {
            transition: background 0.15s;
        }
        tbody tr:hover { background: rgba(255,255,255,0.02); }
        tbody td {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }
        tbody tr:last-child td { border-bottom: none; }

        .task-title { font-weight: 500; }
        .task-project {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.3px;
        }
        .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; }
        .badge.todo { background: rgba(251,191,36,0.1); color: var(--warning); border: 1px solid rgba(251,191,36,0.2); }
        .badge.todo::before { background: var(--warning); }
        .badge.in_progress { background: rgba(96,165,250,0.1); color: var(--info); border: 1px solid rgba(96,165,250,0.2); }
        .badge.in_progress::before { background: var(--info); }
        .badge.done { background: rgba(52,211,153,0.1); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
        .badge.done::before { background: var(--success); }

        .empty-state {
            text-align: center;
            padding: 60px 24px;
            color: var(--text-dim);
        }
        .empty-icon { font-size: 32px; margin-bottom: 12px; opacity: 0.5; }
        .empty-text { font-size: 14px; }

        .due-date { font-size: 13px; color: var(--text-muted); }
        .due-overdue { color: var(--error); }
    </style>
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
    <div class="brand">
        <div class="brand-icon">✦</div>
        <span class="brand-name">Taskflow</span>
    </div>

    <div class="nav-section-label">Navigation</div>
    <a href="/page/dashboard/" class="nav-link active">
        <span class="nav-icon">⊞</span> Dashboard
    </a>
    <a href="/page/projects/" class="nav-link">
        <span class="nav-icon">📁</span> Projects
    </a>
    <a href="/page/tasks/" class="nav-link">
        <span class="nav-icon">✓</span> Tasks
    </a>

    <div class="sidebar-bottom">
        <div class="user-card">
            <div class="user-avatar" id="avatarInitial">?</div>
            <div>
                <div class="user-info-name" id="sidebarUsername">Loading...</div>
                <div class="user-role-badge" id="sidebarRole">—</div>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">
            <span>⇤</span> Sign out
        </button>
    </div>
</aside>

<!-- Main -->
<main class="main">
    <div class="page-header">
        <div>
            <div class="page-title">Good morning, <span id="username">—</span> 👋</div>
            <div class="page-subtitle">Here's what's on your plate today.</div>
        </div>
        <div class="date-chip" id="dateChip">—</div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label"><div class="stat-dot purple"></div>Total Tasks</div>
            <div class="stat-value purple" id="totalTasks">0</div>
        </div>
        <div class="stat-card">
            <div class="stat-label"><div class="stat-dot green"></div>Completed</div>
            <div class="stat-value green" id="doneTasks">0</div>
            <div class="progress-section">
                <div class="progress-bar"><div class="progress-fill" id="progressBar" style="width:0%"></div></div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-label"><div class="stat-dot yellow"></div>Pending</div>
            <div class="stat-value yellow" id="pendingTasks">0</div>
        </div>
    </div>

    <div class="section">
        <div class="section-header">
            <div class="section-title">My Tasks</div>
            <div class="section-count" id="taskCount">0 tasks</div>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Task</th>
                    <th>Status</th>
                    <th>Due Date</th>
                </tr>
            </thead>
            <tbody id="taskTable">
                <tr><td colspan="3"><div class="empty-state"><div class="empty-icon">📋</div><div class="empty-text">Loading tasks...</div></div></td></tr>
            </tbody>
        </table>
    </div>
</main>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || '{}');
if (!token) window.location.href = '/page/login/';

// Set user info
document.getElementById('username').textContent = user.username || '—';
document.getElementById('sidebarUsername').textContent = user.username || 'Unknown';
document.getElementById('sidebarRole').textContent = user.role || 'member';
document.getElementById('avatarInitial').textContent = (user.username || '?')[0].toUpperCase();

// Date
const now = new Date();
document.getElementById('dateChip').textContent = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });

async function loadTasks() {
    try {
        const res = await fetch('/api/tasks/', { headers: { 'Authorization': 'Token ' + token } });
        const tasks = await res.json();
        const total = tasks.length;
        const done = tasks.filter(t => t.status === 'done').length;
        const pending = total - done;
        const pct = total > 0 ? Math.round((done / total) * 100) : 0;

        document.getElementById('totalTasks').textContent = total;
        document.getElementById('doneTasks').textContent = done;
        document.getElementById('pendingTasks').textContent = pending;
        document.getElementById('taskCount').textContent = `${total} task${total !== 1 ? 's' : ''}`;
        setTimeout(() => { document.getElementById('progressBar').style.width = pct + '%'; }, 100);

        const tbody = document.getElementById('taskTable');
        if (tasks.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3"><div class="empty-state"><div class="empty-icon">🎉</div><div class="empty-text">No tasks yet! You're all clear.</div></div></td></tr>`;
            return;
        }
        tbody.innerHTML = tasks.map(t => {
            const isOverdue = t.due_date && new Date(t.due_date) < new Date() && t.status !== 'done';
            return `
            <tr>
                <td>
                    <div class="task-title">${t.title}</div>
                    <div class="task-project">${t.project || '—'}</div>
                </td>
                <td><span class="badge ${t.status}">${t.status.replace('_', ' ')}</span></td>
                <td><span class="due-date ${isOverdue ? 'due-overdue' : ''}">${t.due_date ? new Date(t.due_date).toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) : '—'}</span></td>
            </tr>`;
        }).join('');
    } catch(e) {
        document.getElementById('taskTable').innerHTML = `<tr><td colspan="3"><div class="empty-state"><div class="empty-text">Failed to load tasks.</div></div></td></tr>`;
    }
}

function logout() { localStorage.clear(); window.location.href = '/page/login/'; }
loadTasks();
</script>
</body>
</html>
